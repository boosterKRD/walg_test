  upload-to-launchpad:
    needs: [prepare-source]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - codename: focal
            version: 20.04
            pretty: "Ubuntu 20.04"
          - codename: jammy
            version: 22.04
            pretty: "Ubuntu 22.04"
          - codename: noble
            version: 24.04
            pretty: "Ubuntu 24.04"
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts debhelper dput dpkg-dev gnupg curl
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Download source package artifact
        uses: actions/download-artifact@v4
        with:
          name: wal-g-source
          path: source-artifact

      - name: Extract source archive
        run: |
          mkdir source-tree
          tar xzf source-artifact/wal_g_${VERSION}.tar.gz -C source-tree
          echo "BUILD_DIR=$(pwd)/source-tree" >> $GITHUB_ENV

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY_LUNCHPAD }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> $GITHUB_ENV
          gpg --list-secret-keys

      - name: Patch changelog for ${{ matrix.codename }}
        run: |
          cd $BUILD_DIR
          echo "wal-g (${VERSION}-1~${{ matrix.codename }}) ${{ matrix.codename }}; urgency=medium" > debian/changelog
          echo "" >> debian/changelog
          echo "  * Initial release for ${{ matrix.pretty }}" >> debian/changelog
          echo "" >> debian/changelog
          echo " -- boosterykt <booster.ykt@gmail.com>  $(date -R)" >> debian/changelog

      - name: Build source package
        run: |
          cd $BUILD_DIR
          dpkg-buildpackage -S -d --no-sign

      - name: Sign with debsign
        env:
          GNUPGHOME: ${{ env.GNUPGHOME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd $BUILD_DIR/..
          export GPG_TTY=$(tty)
          echo "allow-loopback-pinentry" >> $GNUPGHOME/gpg.conf
          echo "pinentry-mode loopback" >> $GNUPGHOME/gpg.conf
          # Если возникают проблемы с вводом passphrase, можно предварительно разблокировать ключ, например так:
          # echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 -s <<< "unlock"
          echo "$GPG_PASSPHRASE" | debsign --re-sign *.changes

      - name: Upload to Launchpad
        run: |
          cd $BUILD_DIR/..
          dput ppa:boosterykt/wal-g wal-g_*source.changes
      