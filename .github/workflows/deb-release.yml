name: Build and Publish DEB Package for AMD64

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

env:
  GO_VERSION: "1.22"
  USE_BROTLI: 1
  USE_LIBSODIUM: 1
  USE_LZO: 1

jobs:
  prepare-source:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update dependencies
        run: |
          make go_deps
      - name: Download Golang archives
        run: |
          mkdir -p build
          wget https://go.dev/dl/go1.22.1.linux-amd64.tar.gz -O build/golang-amd64.tar.gz
          wget https://go.dev/dl/go1.22.1.linux-arm64.tar.gz -O build/golang-arm64.tar.gz
      - name: Download libsodium archive
        run: |
          mkdir -p tmp/libsodium
          curl --retry 5 --retry-delay 0 -sL "https://github.com/jedisct1/libsodium/releases/download/1.0.20-RELEASE/libsodium-1.0.20.tar.gz" -o tmp/libsodium/libsodium-1.0.20.tar.gz
      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Generate buildinfo file
        run: |
          echo "WALG_BUILD_DATE=$(date -u +%Y.%m.%d_%H:%M:%S)" > walg.buildinfo
          echo "WALG_GIT_REVISION=$(git rev-parse --short HEAD)" >> walg.buildinfo
          echo "WALG_VERSION=$(git tag -l --points-at HEAD)" >> walg.buildinfo
      - name: Create source archive
        run: |
          tar --warning=no-file-changed -czf wal_g_${VERSION}.tar.gz --exclude=.git . || true
      - name: Upload source package artifact
        uses: actions/upload-artifact@v4
        with:
          name: wal-g-source
          path: wal_g_${{ env.VERSION }}.tar.gz

